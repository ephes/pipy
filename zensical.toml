[project]
site_name = "pipy"
site_url = "https://pipy-agent.readthedocs.io/en/latest/"
site_description = "Native Python coding agent: setup, providers, sessions, MCP, codemode, extensions, and automation."
repo_url = "https://github.com/ephes/pipy"
repo_name = "ephes/pipy"
# Build and preview through scripts/docs.py. Zensical 0.0.41 silently ignores
# MkDocs exclude_docs; the wrapper excludes scratch before Zensical reads it.
nav = [
  {"Home" = "index.md"},
  {"Quickstart" = "quickstart.md"},
  {"Using pipy" = "usage.md"},
  {"Providers and models" = "providers.md"},
  {"Settings" = "settings.md"},
  {"Python codemode" = "codemode.md"},
  {"MCP" = "mcp.md"},
  {"Keybindings" = "keybindings.md"},
  {"Customization" = "customization.md"},
  {"Packages" = "packages.md"},
  {"Sessions" = "sessions.md"},
  {"Compaction" = "compaction.md"},
  {"JSON Mode" = "json.md"},
  {"RPC Mode" = "rpc.md"},
  {"Python SDK" = "sdk.md"},
  {"Terminal Setup" = "terminal-setup.md"},
  {"tmux Setup" = "tmux.md"},
  {"Architecture" = "architecture.md"},
  {"Pi Parity" = "pi-parity.md"},
  {"Harness Spec" = "harness-spec.md"},
  {"Session Storage" = "session-storage.md"},
  {"Workflow capture and sync" = "workflow-capture.md"},
]

[tool.pipy_docs]
exclude_dirs = ["audit", "parity-loop/runs"]
