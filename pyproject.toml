[tool.mypy]
# Repository default stays non-strict while the migration ratchets strictness
# on one subpackage at a time (docs/architecture-migration.md, Phase 7). The
# per-module override below opts the four fully-typed leaves (Slice 7.2), the
# native.providers package and native/http.py (Slice 7.3), the native session
# core (Slice 7.6a), native extension discovery (Slice 7.6b), native REPL
# state (Slice 7.6c), and the top-level CLI (Slice 7.6d) into `--strict`; the
# remaining root modules advance one
# bounded slice at a time. The override lists the per-module `--strict` sub-flags
# explicitly rather than `strict = true`,
# because mypy applies a per-module `strict = true` globally (leaking the
# strict checks onto every other module and the test suite); the explicit
# flags stay scoped to the matched packages. The two strict sub-flags that mypy
# only honours globally — `warn_unused_configs` and `warn_redundant_casts` — are
# hoisted here (they are safe repo-wide and keep the gate genuinely
# `--strict`-equivalent, since they cannot be set per-module).
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "pipy_harness.cli",
    "pipy_harness.native.ui.*",
    "pipy_harness.native.agent.*",
    "pipy_harness.native.coding.*",
    "pipy_harness.native.automation.*",
    "pipy_harness.native.providers.*",
    "pipy_harness.native.extensions",
    "pipy_harness.native.http",
    "pipy_harness.native.repl_state",
    "pipy_harness.native.session",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.slopscope]
exclude_dirs = ["docs"]
