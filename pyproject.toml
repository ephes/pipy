[project]
name = "pipy"
version = "0.1.0"
description = "Local tooling for pipy coding-agent session records."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are intentionally minimal; development tools live in the dev dependency group.
dependencies = [
    "websockets>=16.0,<17",
]

[project.scripts]
pipy = "pipy_harness.cli:main"
pipy-session = "pipy_session.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.0",
    "ruff>=0.14",
    "zensical>=0.0.41,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipy_session", "src/pipy_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Python 3.14 warns when os.forkpty() is called from a multi-threaded
    # process (the runner has background threads). The pty chrome tests exec
    # immediately in the child, so the deadlock hazard does not apply.
    "ignore:.*forkpty\\(\\) may lead to deadlocks.*:DeprecationWarning:pty",
]

[tool.mypy]
# Repository default stays non-strict while the migration ratchets strictness
# on one subpackage at a time (docs/architecture-migration.md, Phase 7). The
# per-module override below opts the four fully-typed leaves (Slice 7.2) plus the
# native.providers package and native/http.py (Slice 7.3) into `--strict`; the
# heavier-debt root `native/` modules are untouched. The override lists the
# per-module `--strict` sub-flags explicitly rather than `strict = true`,
# because mypy applies a per-module `strict = true` globally (leaking the
# strict checks onto every other module and the test suite); the explicit
# flags stay scoped to the matched packages. The two strict sub-flags that mypy
# only honours globally — `warn_unused_configs` and `warn_redundant_casts` — are
# hoisted here (they are safe repo-wide and keep the gate genuinely
# `--strict`-equivalent, since they cannot be set per-module).
warn_unused_configs = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "pipy_harness.native.ui.*",
    "pipy_harness.native.agent.*",
    "pipy_harness.native.coding.*",
    "pipy_harness.native.automation.*",
    "pipy_harness.native.providers.*",
    "pipy_harness.native.http",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.slopscope]
exclude_dirs = ["docs"]
