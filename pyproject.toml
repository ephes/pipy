[project]
name = "pipy"
version = "0.1.0"
description = "Native Python coding agent with TUI, providers, tools, extensions, and headless automation."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies are intentionally minimal; development tools live in the dev dependency group.
dependencies = [
    "websockets>=16.0,<17",
]

[project.scripts]
pipy = "pipy_harness.cli:main"
pipy-session = "pipy_session.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.0",
    "ruff>=0.14",
    "zensical>=0.0.41,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipy_session", "src/pipy_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Python 3.14 warns when os.forkpty() is called from a multi-threaded
    # process (the runner has background threads). The pty chrome tests exec
    # immediately in the child, so the deadlock hazard does not apply.
    "ignore:.*forkpty\\(\\) may lead to deadlocks.*:DeprecationWarning:pty",
]

[tool.ruff.lint]
# The migration ratchets Ruff's mccabe C901 complexity check (Phase 7, Slice
# 7.4, docs/architecture-migration.md). `extend-select` adds C901 on top of
# Ruff's default rule set (E4/E7/E9 + F) without changing it, so `just lint`
# (`ruff check .`) keeps its prior behavior and additionally fails on any *new*
# function whose cyclomatic complexity exceeds the default threshold of 10.
extend-select = ["C901"]

[tool.ruff.lint.per-file-ignores]
# Complexity baseline: every file that already carried a C901 finding at the
# time the gate was introduced is pinned here so no *new* over-complex function
# can land in a previously-clean file. This is a directional ratchet, not the
# end-state — pinned files are burned down over time (Slice 7.4 dropped
# `image_attachment.py` and `command_sandbox.py`; Slice 7.7a dropped three
# strict-leaf invariant owners; Slice 7.7b dropped three strict provider/wire
# owners; Slice 7.7c dropped three more strict provider owners; Slice 7.7d
# dropped the six-finding extension runtime owner; Slice 7.7e1 retired four of
# eight findings in the Codex provider owner; Slice 7.7e2 dropped its remaining
# four findings and pin; Slice 7.7f dropped three workspace/pure-UI leaf
# owners; Slice 7.7g dropped the `read`/`write`/`ls` file-tool owners; Slice
# 7.7h dropped three typed state/package/provider leaf owners; Slice 7.7i
# dropped the agent request/executor and resource-dispatch owners; Slice 7.7j
# dropped the auth/fake/Vertex owners; Slice 7.7k dropped the three-finding
# native request-invariant owner; Slices 7.7l-7.7n dropped nine more leaf
# policy/projection/discovery/comparison/schema owners; Slice 7.7o dropped the
# bash/edit/find concrete-tool owners; Slice 7.7p dropped the terminal-screen
# parser/verifier owner; Slice 7.7q dropped the REPL-input owner; Slice 7.7r
# dropped the command outcome, model resolver, and models.json owners; Slice
# 7.7s dropped the editor-completion and extension-discovery owners; Slice 7.7t
# dropped the tool-renderer, edit-diff, and grep owners; Slice 7.7u dropped the
# native session policy, session-tree reconstruction, and session-tree command
# owners; Slice 7.7v dropped the coding-session controller and provider
# construction owners; Slice 7.7w dropped the resource-file discovery,
# terminal-driver, and archive-catalog owners). Do not add entries to grow the
# baseline; only remove entries as functions are genuinely simplified below the
# threshold.
"docs/examples/extensions/answer.py" = ["C901"]
"docs/examples/extensions/pipy-extension-conformance.py" = ["C901"]
"scripts/parity_checks/extension_message_renderer_conformance.py" = ["C901"]
"scripts/parity_lessons.py" = ["C901"]
"scripts/parity_runner.py" = ["C901"]
"src/pipy_harness/cli.py" = ["C901"]
"src/pipy_harness/native/tool_loop_session.py" = ["C901"]
"src/pipy_harness/native/tui.py" = ["C901"]
"src/pipy_session/cli.py" = ["C901"]
"tests/test_native_agent_loop_policy_adapters.py" = ["C901"]
"tests/test_native_tool_loop_session_fork_clone.py" = ["C901"]
"tests/test_native_tool_loop_session_tree.py" = ["C901"]
"tests/test_parity_probe_trust.py" = ["C901"]

[tool.mypy]
# Repository default stays non-strict while the migration ratchets strictness
# on one subpackage at a time (docs/architecture-migration.md, Phase 7). The
# per-module override below opts the four fully-typed leaves (Slice 7.2), the
# native.providers package and native/http.py (Slice 7.3), the native session
# core (Slice 7.6a), native extension discovery (Slice 7.6b), native REPL
# state (Slice 7.6c), the top-level CLI (Slice 7.6d), the tool-loop composition
# root (Slice 7.6e), native TUI (Slice 7.6f), and the complete seven-module
# extension ownership surface (architecture-quality Slice 7), plus the
# settings/package-manager/session-tree-command support batch
# (architecture-quality Slice 8a) and package-resource/package-runtime/
# resource-dispatch support batch (architecture-quality Slice 8b), plus the
# REPL-input/autocomplete-provider/tool-renderer terminal-support batch
# (architecture-quality Slice 8c), and the routing/OAuth/models.json
# provider-model-policy batch (architecture-quality Slice 8d), plus the
# catalog-state/provider-construction/ds4 support batch (architecture-quality
# Slice 8e), into
# `--strict`.
# The override lists the
# per-module `--strict` sub-flags explicitly rather than `strict = true`,
# because mypy applies a per-module `strict = true` globally (leaking the
# strict checks onto every other module and the test suite); the explicit
# flags stay scoped to the matched packages. The three strict flags that mypy
# only honours globally — `warn_unused_configs`, `warn_redundant_casts`, and
# `strict_bytes` — are hoisted here (they are safe repo-wide and keep the gate
# genuinely `--strict`-equivalent, since they cannot be set per-module).
warn_unused_configs = true
warn_redundant_casts = true
strict_bytes = true

[[tool.mypy.overrides]]
module = [
    "pipy_harness.cli",
    "pipy_harness.extensions",
    "pipy_harness.native.ui.*",
    "pipy_harness.native.agent.*",
    "pipy_harness.native.coding.*",
    "pipy_harness.native.automation.*",
    "pipy_harness.native.providers.*",
    "pipy_harness.native.extension_hooks",
    "pipy_harness.native.extension_loader",
    "pipy_harness.native.extension_runtime",
    "pipy_harness.native.extension_types",
    "pipy_harness.native.extension_ui",
    "pipy_harness.native.extensions",
    "pipy_harness.native.http",
    "pipy_harness.native.repl_state",
    "pipy_harness.native.session",
    "pipy_harness.native.tool_loop_session",
    "pipy_harness.native.tui",
    "pipy_harness.native.settings",
    "pipy_harness.native.package_manager",
    "pipy_harness.native.session_tree_commands",
    "pipy_harness.native.package_resources",
    "pipy_harness.native.package_runtime",
    "pipy_harness.native.resources",
    "pipy_harness.native.repl_input",
    "pipy_harness.native.autocomplete_provider",
    "pipy_harness.native.tool_renderers",
    "pipy_harness.native.routing",
    "pipy_harness.native.oauth_providers",
    "pipy_harness.native.models_json",
    "pipy_harness.native.catalog_state",
    "pipy_harness.native.provider_construction",
    "pipy_harness.native.ds4",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.slopscope]
exclude_dirs = ["docs"]
